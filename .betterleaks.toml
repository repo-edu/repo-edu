# Betterleaks configuration for both leak-scan commands, the hook and the history report.
# The rules are in leak-scan.md.
# Credential allowances name fixtures by exact text; only the email rule allows licence paths.

[extend]
useDefault = true

[[allowlists]]
regexTarget = "match"
regexes = [
  # The repository test harness clone URL, with an optional numbered token.
  '''https://x-access-token:token(-[0-9]+)?@github\.com/''',
  # The PEM block the examination privacy filter test must detect and redact.
  '''-----BEGIN PRIVATE KEY-----", privateKeyBody\]\)''',
  # The Gitea and GitLab integration harness accounts on the local Docker instances.
  '''PASSWORD = "test-admin-pw"''',
  '''password: "test-user-pw-00"''',
  '''password: "S9mR4tK8qP2vX7nL5dH1cB6wF3zJ"''',
  '''PASSWORD:-R7vK2pQ9mL4xT8nC5bH3jF6sD1wZ}''',
  # The signing test value that must stay recognisable so its redaction can be asserted.
  '''PASSWORD: "p12-password"''',
]

[[rules]]
id = "email-address"
description = "Email address outside the fixture allow list"
regex = '''(?i)[a-z0-9._%+-]+@[a-z0-9][a-z0-9.-]*\.[a-z]{2,}'''
keywords = ["@"]

[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''(?i)^d\.a\.v\.beek@tue\.nl$''',
  '''(?i)^opensource@repo-edu\.dev$''',
  '''(?i)@([a-z0-9-]+\.)*example\.(com|org|net|edu)$''',
  '''(?i)@[a-z0-9.-]+\.(test|invalid|local)$''',
  '''^token(-[0-9]+)?@github\.com$''',
]

[[rules.allowlists]]
paths = ['''(^|/)licenses/''']
