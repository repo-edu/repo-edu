packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@openai/codex-sdk": 0.147.0
  koffi: 3.1.5

# Headless installs must not stop at the modules-dir purge prompt.
confirmModulesPurge: false

allowBuilds:
  bun: true
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  sharp: true
  tree-sitter-cli: true

patchedDependencies:
  outmatch@1.0.0: patches/outmatch@1.0.0.patch
