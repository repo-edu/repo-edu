name: CI Git integration

on:
  push:
    branches:
      - main
    paths:
      - "packages/integrations-git/**"
      - "packages/integrations-git-contract/**"
      - "packages/integration-tests/**"
      - "packages/host-node/src/index.ts"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to validate (default: current ref)"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, or SHA to validate (default: caller ref)"
        required: false
        type: string
    secrets:
      INTEGRATION_GITHUB_TOKEN:
        required: true
      INTEGRATION_GITHUB_ORG:
        required: true

concurrency:
  group: ci-git-integration
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  live-git-providers:
    name: live-git-providers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup

      - name: Test Gitea replies
        run: pnpm test:integration:gitea

      - name: Test GitLab replies
        run: pnpm test:integration:gitlab

      # Every GitHub run creates content in the test organisation. A Renovate
      # push proves nothing there unless it changes a Git client library's
      # declared version; main and release runs always test GitHub.
      - name: Decide whether GitHub runs
        id: github-run
        run: |
          case "${GITHUB_REF}" in
            refs/heads/renovate/*)
              git fetch --no-tags --depth=1 origin main
              if git diff origin/main HEAD -- packages/integrations-git/package.json \
                | grep -E '^[-+] *"@(octokit|gitbeaker)/rest":'; then
                echo "run=true" >> "${GITHUB_OUTPUT}"
              else
                echo "GitHub stays untested: the branch leaves the Git client libraries alone."
                echo "run=false" >> "${GITHUB_OUTPUT}"
              fi
              ;;
            *)
              echo "run=true" >> "${GITHUB_OUTPUT}"
              ;;
          esac

      - name: Test GitHub replies
        if: steps.github-run.outputs.run == 'true'
        env:
          INTEGRATION_GITHUB_ORG: ${{ secrets.INTEGRATION_GITHUB_ORG }}
          INTEGRATION_GITHUB_TOKEN: ${{ secrets.INTEGRATION_GITHUB_TOKEN }}
        run: pnpm test:integration:github
